# Port-8892 gateway of THOR: one address for every visualization service.
#   /                 -> /hub/ (visualization hub landing page)
#   /hub/ /spatial/ /single-cell/ /crispr/   -> hub backend   127.0.0.1:8893 (hub/server.py)
#   /genome-canvas/   -> Genome Canvas                        127.0.0.1:8000 (genome-canvas/server.py)
#   everything else   -> JupyterLab (/lab, /api, kernels...)  127.0.0.1:8891
# Run by vizhub-gateway.service (systemd user unit); manage with ../vizhubctl.
ServerRoot "/nfs/baldar/quanyiz/vizhub/gateway"
DefaultRuntimeDir "/nfs/baldar/quanyiz/vizhub/gateway/run"
PidFile "/nfs/baldar/quanyiz/vizhub/gateway/run/apache.pid"

Listen 0.0.0.0:8892
ServerName 171.65.68.140
ServerAdmin quanyiz@localhost

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module /usr/lib/apache2/modules/mod_proxy_wstunnel.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so

ErrorLog "/nfs/baldar/quanyiz/vizhub/gateway/logs/error.log"
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "/nfs/baldar/quanyiz/vizhub/gateway/logs/access.log" combined
LogLevel warn

KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 600

RewriteEngine On
# Landing page and slashless entry points (mod_rewrite runs before ProxyPass)
RewriteRule ^/$ /hub/ [R=302,L]
RewriteRule ^/(hub|spatial|single-cell|crispr|genome-canvas)$ /$1/ [R=302,L]

# Visualization hub: hub page, spatial / single-cell viewers, CRISPR explorer and their API
ProxyPass        /hub/         http://127.0.0.1:8893/hub/
ProxyPassReverse /hub/         http://127.0.0.1:8893/hub/
ProxyPass        /spatial/     http://127.0.0.1:8893/spatial/
ProxyPassReverse /spatial/     http://127.0.0.1:8893/spatial/
ProxyPass        /single-cell/ http://127.0.0.1:8893/single-cell/
ProxyPassReverse /single-cell/ http://127.0.0.1:8893/single-cell/
ProxyPass        /crispr/      http://127.0.0.1:8893/crispr/
ProxyPassReverse /crispr/      http://127.0.0.1:8893/crispr/
<LocationMatch "^/(hub|spatial|single-cell|crispr)/">
    RequestHeader unset X-Remote-User
</LocationMatch>

# Genome Canvas uses an application-level, password-free workspace selector.
ProxyPass        /genome-canvas/ http://127.0.0.1:8000/ nocanon
ProxyPassReverse /genome-canvas/ http://127.0.0.1:8000/
<Location "/genome-canvas/">
    RequestHeader unset X-Remote-User
    RequestHeader set X-Forwarded-Prefix "/genome-canvas"
</Location>

# Preserve Jupyter kernel and terminal WebSocket upgrades.
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/(.*)$ ws://127.0.0.1:8891/$1 [P,L]

# Everything else remains the existing JupyterLab site.
ProxyPass        / http://127.0.0.1:8891/ nocanon
ProxyPassReverse / http://127.0.0.1:8891/
