<header class="hubnav">
  <a class="hub-home" href="/hub/" title="Back to the Omics Canvas home page" aria-label="Omics Canvas home">
    <img src="/hub/static/favicon.svg" alt="" width="18" height="18" /><span>Omics Canvas</span>
  </a>
  <a class="hubnav__title" data-page-title></a>
  <div class="hubnav__actions">
    <button type="button" class="ws-button" data-ws-button title="Your workspace (shared with Genome Canvas)">
      <span class="ws-avatar"><svg class="icon"><use href="#i-layers"/></svg></span><b data-ws-name>Workspace</b><svg class="icon chevron"><use href="#i-chevron-down"/></svg>
    </button>
    <button type="button" class="btn btn--quiet theme-toggle" data-theme-toggle title="Switch theme" aria-label="Switch theme"><svg class="icon icon-moon"><use href="#i-moon"/></svg><svg class="icon icon-sun"><use href="#i-sun"/></svg></button>
  </div>
</header>
<dialog class="ws-dialog" data-ws-dialog>
  <form method="dialog" class="ws-card">
    <div class="ws-head"><img src="/hub/static/favicon.svg" alt="" width="34" height="34" /><div><b>Choose your workspace</b><small>Datasets you add are kept in your workspace — the same one you use in Genome Canvas.</small></div></div>
    <div class="ws-search"><input class="input" type="search" placeholder="Find a workspace" data-ws-q aria-label="Find a workspace" /></div>
    <ul class="ws-list" data-ws-list><li class="muted">Loading…</li></ul>
    <div class="ws-create"><input class="input" type="text" maxlength="48" placeholder="New workspace name" data-ws-new aria-label="New workspace name" /><button type="button" class="btn btn--light" data-ws-create><svg class="icon"><use href="#i-plus"/></svg>Create</button></div>
    <p class="err ws-err" data-ws-err hidden></p>
    <div class="ws-foot"><button type="submit" class="btn btn--quiet" data-ws-close>Close</button></div>
  </form>
</dialog>
