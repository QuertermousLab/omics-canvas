<div class="cx" data-cx>
  <header class="cx-head">
    <a class="back" href="/hub/">← Visualization hub</a>
    <select class="input" data-screen aria-label="Screen"></select>
    <span class="cx-reports" data-reports hidden></span>
    <p class="cx-facts" data-facts></p>
    <p class="cx-source" data-source></p>
  </header>
  <div class="cx-body">
    <aside class="cx-list">
      <div class="cx-filter">
        <input class="input" type="search" data-q aria-label="Filter" />
        <label class="check"><input type="checkbox" data-sig /> <span data-sig-label>Significant only</span></label>
      </div>
      <div class="cx-count"><span data-count></span>
        <button type="button" class="btn btn--quiet btn--xs" data-export title="Download the rows shown (search and filter applied) as CSV">Export table (CSV)</button></div>
      <div class="cx-table"><table class="table" data-table></table></div>
    </aside>
    <main class="cx-main">
      <section class="cx-panel">
        <div class="cx-panel-head"><h3 data-title-a></h3><span class="muted" data-hint-a></span></div>
        <div class="cx-plot"><canvas data-plot-a></canvas><div class="cx-tip" data-tip-a hidden></div></div>
      </section>
      <section class="cx-panel" data-panel-b hidden>
        <div class="cx-panel-head">
          <h3 data-title-b></h3>
          <input class="input cx-find" type="search" placeholder="Find a gene" data-find aria-label="Find a gene" />
        </div>
        <div class="cx-plot"><canvas data-plot-b></canvas><div class="cx-tip" data-tip-b hidden></div></div>
      </section>
      <section class="cx-detail" data-detail></section>
      <section class="cx-detail" data-lookup hidden></section>
    </main>
  </div>
  <div class="cx-msg" data-msg>Loading…</div>
</div>
