name: macOS UI preview

# Builds the native app on macOS and captures its window in the light and dark
# themes, so interface changes can be reviewed without a local Mac.
on:
  workflow_dispatch:
  push:
    branches:
      - "mac-ui-*"

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build native app
        working-directory: macos/GenomeCanvasDesktop
        run: ./build.sh dist/preview
      - name: Capture light and dark windows
        working-directory: macos/GenomeCanvasDesktop
        shell: bash
        run: |
          shots="${RUNNER_TEMP}/shots"
          mkdir -p "${shots}"
          GENOME_CANVAS_SNAPSHOT_DIR="${shots}" \
            "dist/preview/Genome Canvas.app/Contents/MacOS/GenomeCanvasDesktop" > "${shots}/app.log" 2>&1 &
          for attempt in $(seq 1 60); do
            [[ -f "${shots}/window-dark.png" ]] && break
            sleep 2
          done
          cp "${HOME}/Library/Application Support/Genome Canvas/local-backend.log" "${shots}/" 2>/dev/null || true
          ls -la "${shots}"
          test -f "${shots}/window-light.png"
          test -f "${shots}/window-dark.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-ui-preview
          path: ${{ runner.temp }}/shots
